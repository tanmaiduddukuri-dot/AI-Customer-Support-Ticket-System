spring.application.name=helpdesk
server.port=8080

# Reads DB_URL / DB_USER / DB_PASSWORD from the .env file in the project folder
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set to true to print every SQL statement (useful for explaining queries to judges)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
